/**:
  ros__parameters:
    # Log directory configuration
    log_path: "/tmp/continuous_logs"
    log_prefix: "log_"
    
    # Log splitting configuration
    log_split_time: 10  # seconds - split every 10 seconds for crash-loss reduction
    log_split_size: 1073741824  # bytes - 1GB max size per file
    
    # Disk management configuration
    max_disk_usage_percent: 80.0  # Maximum disk usage before rotation
    disk_warning_threshold_percent: 90.0  # Warning threshold for disk usage
    disk_check_interval: 60.0  # Check every 60 seconds
    
    # Topics to log (keyed under "topics.<key>")
    topics:
      rosout:
        name: "/rosout"
        throttle: 0  # No throttling
      
      tf:
        name: "/tf"
        throttle: 0
      
      tf_static:
        name: "/tf_static"
        throttle: 0
      
      scan:
        name: "/scan"
        throttle: 10  # Only log every 10th message
      
      odom:
        name: "/odom"
        throttle: 5  # Only log every 5th message
      
      cmd_vel:
        name: "/cmd_vel"
        throttle: 0
    
    # Event-triggered snapshot configurations (keyed under "event_snapshots.<key>")
    event_snapshots:
      error_event:
        event_name: "system_error"
        time_before: 10.0  # seconds
        time_after: 5.0    # seconds
        tags: ["error", "important"]
        description: "Automatic snapshot for {event_name}"
      
      collision:
        event_name: "collision_detected"
        time_before: 5.0
        time_after: 5.0
        tags: ["collision", "safety", "critical"]
        description: "Collision event snapshot"
      
      goal_reached:
        event_name: "navigation_goal_reached"
        time_before: 2.0
        time_after: 2.0
        tags: ["navigation", "success"]
        description: "Goal reached: {event_name}"
